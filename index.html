<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>B_BoardGames</title>
    <link rel="icon" type="image/png" href="./assets/icon.png" />
    <link rel="apple-touch-icon" href="./assets/icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black: iOS がステータスバーのぶんを確保し、ページはその下から始まる。
         black-translucent はページがステータスバーの下に潜り込む指定で、
         ノッチの無い端末では env(safe-area-inset-top) が 0 のままなので
         充電・電波マークと重なってしまう（CSS側では避けきれない）。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="stylesheet" href="./bbg.css?v=20260829165234" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="header-row">
          <div class="header-title">
            <h1>B_BoardGames</h1>
            <!-- 効果音の入切。プレイ画面の場所を取らないよう、タイトルの横だけに置く。
                 設定は端末に保存されるので、ロビーで切り替えればゲーム中もそのまま効く。 -->
            <button type="button" class="bbg-fx-toggle bbg-fx-toggle--header" id="bbgFxToggle" aria-label="効果音" title="効果音">🔊</button>
          </div>
          <div>
            <button id="headerLobbyBack" class="ghost" style="display:none">ロビーへ戻る</button>
          </div>
        </div>
      </header>

      <section id="view" class="card" aria-live="polite"></section>

      <footer class="footer">
        <small>
          <span id="buildInfo"></span>
        </small>
        <div style="text-align:center;margin-top:4px;">
          <span id="versionString" style="font-weight:bold;font-size:14px;color:var(--accent);"></span>
        </div>
      </footer>
    </main>

    <!-- QR生成（軽量CDN） -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

    <!-- Optional: embedded Firebase config (see bbg-config.js) -->
    <script src="./bbg-config.js?v=20260829165234"></script>

    <script src="./bbg.js?v=20260829165234" defer></script>

    <!-- PWA Service Worker (自動アップデート付き) -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;

        navigator.serviceWorker
          .register('./sw.js')
          .then(function (reg) {
            // 更新チェック: 起動時に加えて、フォアグラウンド復帰時と30分ごと
            function check() {
              try {
                reg.update();
              } catch (e) {
                /* ignore */
              }
            }
            setInterval(check, 30 * 60 * 1000);
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') check();
            });
          })
          .catch(function (e) {
            console.warn('SW registration failed:', e);
          });

        // 新しいSWが有効になったら自動リロードして最新版に切り替える。
        // - 初回インストール時（もともと未制御だったページ）はリロードしない
        // - ゲームルーム表示中（?room=あり）はリロードしない（描きかけの絵などを守る）
        var hadController = !!navigator.serviceWorker.controller;
        var reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController) {
            hadController = true;
            return;
          }
          if (reloaded) return;
          if (/[?&]room=/.test(location.search)) return;
          reloaded = true;
          try {
            sessionStorage.setItem('bbg_updated_v1', '1');
          } catch (e) {
            /* ignore */
          }
          location.reload();
        });

        // リロード後に「更新しました」トーストを表示
        function showUpdatedToast() {
          try {
            if (sessionStorage.getItem('bbg_updated_v1') !== '1') return;
            sessionStorage.removeItem('bbg_updated_v1');
            var t = document.createElement('div');
            t.className = 'bbg-toast';
            t.textContent = '✨ アプリを さいしんばんに こうしんしました';
            document.body.appendChild(t);
            setTimeout(function () {
              t.classList.add('bbg-toast--hide');
            }, 3200);
            setTimeout(function () {
              if (t.parentNode) t.parentNode.removeChild(t);
            }, 3600);
          } catch (e) {
            /* ignore */
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', showUpdatedToast);
        } else {
          showUpdatedToast();
        }
      })();
    </script>
  </body>
</html>
