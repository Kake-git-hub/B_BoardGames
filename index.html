<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>B_BoardGames</title>
    <link rel="icon" type="image/png" href="./assets/icon.png" />
    <link rel="apple-touch-icon" href="./assets/icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#6c63ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="./bbg.css?v=20260720000504" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="header-row">
          <div>
            <h1>B_BoardGames</h1>
          </div>
          <div>
            <button id="headerLobbyBack" class="ghost" style="display:none">ロビーへ戻る</button>
          </div>
        </div>
      </header>

      <section id="view" class="card" aria-live="polite"></section>

      <footer class="footer">
        <small>
          <span id="buildInfo"></span>
        </small>
        <div style="text-align:center;margin-top:4px;">
          <span id="versionString" style="font-weight:bold;font-size:14px;color:var(--accent);"></span>
        </div>
      </footer>
    </main>

    <!-- QR生成（軽量CDN） -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

    <!-- Optional: embedded Firebase config (see bbg-config.js) -->
    <script src="./bbg-config.js?v=20260720000504"></script>

    <script src="./bbg.js?v=20260720000504" defer></script>

    <!-- PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(function(e) {
          console.warn('SW registration failed:', e);
        });
      }
    </script>
  </body>
</html>
